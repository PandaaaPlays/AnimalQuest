# Job level experience configuration (exponential progression)
# Level: Experience needed to level up to the next level.
# Ex.: 1: 200 means 200 experience required to go from level 1 to level 2.
# Jobs max level is 20, so level 19 is the last that requires experience to level up.
levels:
  1: 200
  2: 500
  3: 700
  4: 1000
  5: 1400
  6: 1900
  7: 2600
  8: 3500
  9: 5000
  10: 7000
  11: 9500
  12: 13000
  13: 18500
  14: 25500
  15: 35000
  16: 49000
  17: 68000
  18: 90000
  19: 100000
